{% extends 'base.html' %}

{% block title %}
    Inicio | Mi Sistema
{% endblock %}

{% block content %}

    <div class="contenedor-galeria">
        <div class="tarjeta-manga">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUmRwwrlYyFkdl5Xy4mom5_YPtiqwDYy-dOlO6vc4uUg&s" alt="La Boticaria">
            <div class="capa-efecto"></div>
            <div class="info-manga">
                <h3>Como ser estoico</h3>
            </div>
        </div>

        <div class="tarjeta-manga">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPH8M5FMFGvX81gN_K2xVt4vYw4HGGN0grrgZqdyfAUg&s=10" alt="Madoka Magica">
            <div class="capa-efecto"></div>
            <div class="info-manga">
                <h3>El arte de pensar</h3>
            </div>
        </div>

        <div class="tarjeta-manga">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkjBmj0JcKh6xra8p7Vx6PKxr9XOu4pCtlZvKaYdOTKA&s=10" alt="Berserk">
            <div class="capa-efecto"></div>
            <div class="info-manga">
                <h3>El mundo de sofia</h3>
            </div>
        </div>

        <div class="tarjeta-manga">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQA2RR3GFbzFlFYCLSrffLBVLGIShV7jAJ1lDYX1qrltg&s=10" alt="Tu Nombre">
            <div class="capa-efecto"></div>
            <div class="info-manga">
                <h3>el fuego de la libertad</h3>
            </div>
        </div>

        <div class="tarjeta-manga">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSekwaHgmEYe-XiKP9mHk92ZLFyca3WYi_atOucvKaKTA&s=10" alt="One Piece">
            <div class="capa-efecto"></div>
            <div class="info-manga">
                <h3>filosofia de los simpson</h3>
            </div>
        </div>
    </div>
</div>
        
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .pagina {
        min-height: 50vh;
        background: linear-gradient(135deg, #2b22aa 0%, #312e81 50%, #4338ca 100%);
        padding: 50px 20px;
    }

    .contenedor-titulo {
        text-align: center;
        margin-bottom: 60px;
    }

    .titulo-principal {
        font-size: 3.5rem;
        color: #131212;
        font-weight: 800;
        letter-spacing: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 25px;
        text-shadow: 0 0 20px rgba(167, 139, 250, 0.6);
    }

    .linea-decorativa {
        width: 80px;
        height: 4px;
        background: linear-gradient(90deg, transparent, #a78bfa, transparent);
        border-radius: 2px;
    }

    .subtitulo {
        color: #c7d2fe;
        font-size: 1.2rem;
        margin-top: 15px;
        letter-spacing: 2px;
    }

    .contenedor-galeria {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
        max-width: 1600px;
        margin: 0 auto;
    }

    .tarjeta-manga {
        position: relative;
        width: 200px;
        height: 300px;
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 
            0 10px 30px rgba(0, 0, 0, 0.5),
            0 0 0 1px rgba(255, 255, 255, 0.1);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tarjeta-manga img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .capa-efecto {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to top, 
            rgba(0, 0, 0, 0.85) 0%, 
            rgba(67, 56, 202, 0.4) 50%, 
            transparent 100%);
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .info-manga {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 25px 15px;
        transform: translateY(30px);
        opacity: 0;
        transition: all 0.4s ease;
    }

    .info-manga h3 {
        color: #fff;
        font-size: 1.1rem;
        font-weight: 600;
        text-align: center;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Efecto al pasar el cursor */
    .tarjeta-manga:hover {
        transform: translateY(-15px) scale(1.05);
        box-shadow: 
            0 20px 40px rgba(0, 0, 0, 0.6),
            0 0 30px rgba(167, 139, 250, 0.4);
    }

    .tarjeta-manga:hover img {
        transform: scale(1.1);
    }

    .tarjeta-manga:hover .capa-efecto {
        opacity: 1;
    }

    .tarjeta-manga:hover .info-manga {
        transform: translateY(0);
        opacity: 1;
    }

    /* Responsivo */
    @media (max-width: 768px) {
        .titulo-principal {
            font-size: 2rem;
            letter-spacing: 4px;
        }

        .linea-decorativa {
            width: 40px;
        }

        .tarjeta-manga {
            width: 160px;
            height: 240px;
        }

        .contenedor-galeria {
            gap: 25px;
        }
    }
</style>

{% endblock %}
